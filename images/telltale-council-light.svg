<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; rx: 12px; }
      .header-bg { fill: #f6f8fa; }
      .border { stroke: #d0d7de; stroke-width: 1px; fill: none; }
      .text-title { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 14px; font-weight: bold; fill: #0969da; }
      .text-dim { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; fill: #57606a; }
      .text-normal { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; fill: #24292f; }
      .text-bold { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; font-weight: bold; fill: #1f2328; }
      .text-highlight { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; fill: #1a7f37; }
      .text-warn { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; fill: #9a6700; }
      .text-purple { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 13px; fill: #8250df; }
      
      /* Badges */
      .badge-ro { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1px; }
      .badge-ro-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #1a7f37; font-weight: bold; }
      .badge-unsandboxed { fill: #ffebe9; stroke: #cf222e; stroke-width: 1px; }
      .badge-unsandboxed-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #cf222e; font-weight: bold; }
      .badge-tokens { fill: #ddf4ff; stroke: #0969da; stroke-width: 1px; }
      .badge-tokens-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #0969da; }
    </style>
  </defs>

  <!-- Background Window -->
  <rect x="0" y="0" width="960" height="440" class="bg" />
  <rect x="0" y="0" width="960" height="440" rx="12" class="border" />

  <!-- Window Header / Title Bar -->
  <rect x="0" y="0" width="960" height="38" class="header-bg" rx="12" />
  <rect x="0" y="26" width="960" height="12" class="header-bg" />
  <circle cx="20" cy="19" r="6" fill="#ff5f56" />
  <circle cx="40" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="19" r="6" fill="#27c93f" />
  <text x="480" y="24" text-anchor="middle" class="text-dim">telltale council — multi-agent dispatch room</text>
  <line x1="0" y1="38" x2="960" y2="38" stroke="#d0d7de" stroke-width="1" />

  <!-- Top Council Bar -->
  <text x="24" y="66" class="text-title">council</text>
  <text x="95" y="66" class="text-dim">~/code/telltale</text>
  
  <text x="680" y="66" class="text-dim">turn 1  │  3/3 seated  │  no brief</text>

  <line x1="24" y1="84" x2="936" y2="84" stroke="#d0d7de" stroke-width="1" />

  <!-- Column Separators -->
  <line x1="324" y1="85" x2="324" y2="380" stroke="#d0d7de" stroke-width="1" />
  <line x1="636" y1="85" x2="636" y2="380" stroke="#d0d7de" stroke-width="1" />

  <!-- Column 1: Claude Code -->
  <text x="40" y="110" class="text-bold">▸ Claude Code</text>
  <text x="260" y="110" class="text-highlight">done</text>
  
  <rect x="40" y="122" width="70" height="18" rx="4" class="badge-ro" />
  <text x="48" y="135" class="badge-ro-text">ro:tools</text>

  <rect x="120" y="122" width="60" height="18" rx="4" class="badge-tokens" />
  <text x="128" y="135" class="badge-tokens-text">tokens</text>

  <line x1="40" y1="150" x2="308" y2="150" stroke="#eaeef2" stroke-width="1" />

  <text x="40" y="175" class="text-purple">⚙ Glob</text>
  <text x="105" y="175" class="text-dim">cmd/telltale/*.go</text>
  
  <text x="40" y="200" class="text-purple">⚙ Read</text>
  <text x="105" y="200" class="text-dim">cmd/telltale/main.go</text>

  <text x="40" y="225" class="text-purple">⚙ Bash</text>
  <text x="105" y="225" class="text-dim">go test ./...</text>

  <rect x="40" y="250" width="268" height="110" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" />
  <text x="56" y="275" class="text-highlight">✓ Tests pass.</text>
  <text x="56" y="300" class="text-normal">All 42 package tests green.</text>
  <text x="56" y="325" class="text-dim">Execution time: 1.42s</text>
  <text x="56" y="345" class="text-dim">Cost: $0.0034</text>

  <!-- Column 2: Codex -->
  <text x="344" y="110" class="text-bold">▸ Codex</text>
  <text x="580" y="110" class="text-dim">idle</text>

  <rect x="344" y="122" width="90" height="18" rx="4" class="badge-ro" />
  <text x="352" y="135" class="badge-ro-text">ro:requested</text>

  <rect x="444" y="122" width="75" height="18" rx="4" class="badge-tokens" />
  <text x="452" y="135" class="badge-tokens-text">final only</text>

  <line x1="344" y1="150" x2="620" y2="150" stroke="#eaeef2" stroke-width="1" />

  <text x="344" y="180" class="text-dim">no turn dispatched yet.</text>
  <text x="344" y="210" class="text-dim">Awaiting prompt or @codex</text>
  <text x="344" y="235" class="text-dim">routing tag.</text>

  <!-- Column 3: Antigravity -->
  <text x="656" y="110" class="text-bold">▸ Antigravity</text>
  <text x="890" y="110" class="text-dim">idle</text>

  <rect x="656" y="122" width="95" height="18" rx="4" class="badge-unsandboxed" />
  <text x="664" y="135" class="badge-unsandboxed-text">unsandboxed</text>

  <rect x="760" y="122" width="75" height="18" rx="4" class="badge-tokens" />
  <text x="768" y="135" class="badge-tokens-text">final only</text>

  <line x1="656" y1="150" x2="920" y2="150" stroke="#eaeef2" stroke-width="1" />

  <text x="656" y="180" class="text-dim">no turn dispatched yet.</text>
  <text x="656" y="210" class="text-dim">Awaiting prompt or @agy</text>
  <text x="656" y="235" class="text-dim">routing tag.</text>

  <!-- Footer Line -->
  <line x1="24" y1="380" x2="936" y2="380" stroke="#d0d7de" stroke-width="1" />
  <text x="24" y="408" class="text-dim">
    <tspan fill="#0969da">›</tspan> ask @claude to review PRs...
  </text>
  <text x="480" y="408" class="text-dim">
    <tspan fill="#0969da">↑↓</tspan> scroll   
    <tspan fill="#0969da">f</tspan> expand   
    <tspan fill="#0969da">tab</tspan> focus   
    <tspan fill="#0969da">i</tspan> compose   
    <tspan fill="#0969da">?</tspan> help   
    <tspan fill="#0969da">q</tspan> quit
  </text>
</svg>