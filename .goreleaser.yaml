# goreleaser — the whole of tag day.
#
# `git tag v0.2.0 && git push origin v0.2.0` is the only command a release
# takes; `.github/workflows/release.yml` runs the repo's own gate (ci.yml:
# windows-latest, the race job on ubuntu-latest, and the darwin job on
# macos-latest) and then runs this file. Nothing here fires on a merge to
# main: the workflow's only trigger is a v* tag, so this config is inert until
# one exists.
#
# The packaging decisions behind it — target list, platform labels, the
# in-repo scoop bucket, the winget draft, and what is deliberately NOT
# published — are recorded in docs/design.md §8 (adoption track, ADR-005).
version: 2

project_name: telltale

before:
  hooks:
    # Download, never tidy. A release must build the module as committed; a
    # hook that can rewrite go.mod mid-release makes the artifact a different
    # thing from the tree the gate just passed.
    - go mod download

builds:
  - id: telltale
    main: ./cmd/telltale
    binary: telltale
    env:
      # CGO off is what makes one Linux runner able to produce all four
      # binaries, and it costs nothing here: the repo has no cgo dependency
      # (the SQLite readers for Antigravity and Cursor are written in Go
      # precisely so there isn't one — design.md §3.8/§3.9).
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # main.version is the `var version = "dev"` in cmd/telltale/main.go. A
      # source build says "dev" and a released build says its tag, which is
      # the same zero-versus-absent distinction the gauges make about data:
      # `telltale version` must never claim a release number it wasn't given.
      - -s -w -X main.version={{ .Version }}
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      # The target list is deliberately short, and every entry in it is a
      # platform someone is expected to run telltale on today. windows/arm64
      # and linux/arm64 have neither a verification story nor a known user,
      # and an unlabelled binary nobody has run is the packaging version of a
      # rendered guess.
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64

archives:
  - id: telltale
    ids: [telltale]
    # windows_amd64 rather than Windows_x86_64: the winget draft and the scoop
    # manifest both hard-code these names, so the template is load-bearing and
    # kept boring.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/council.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# syft writes one SBOM for each archive, in SPDX-JSON format (design.md §8,
# amended 2026-08-16). `.github/workflows/release.yml` installs a pinned syft
# before this file runs. goreleaser only calls the command.
#
# The unit is the archive, and not the binary. A user downloads an archive, and
# the provenance attestation names an archive. Two documents that describe the
# same release from different angles help no reader.
#
# This comment states what the SBOM contains. Every target is CGO-free and
# statically linked. The module graph holds 14 entries, and only
# `golang.org/x/sys` sits outside the TUI stack. The document is therefore
# short. It is an accurate list, and it is not an impressive one. It names the
# Go modules that the build used. It does not describe the vendor CLI programs
# that `telltale council` starts. The operator installs those programs, and
# telltale ships none of them.
#
# This block takes effect at the NEXT tag. No published release carries an SBOM.
sboms:
  - id: archives
    artifacts: archive

snapshot:
  # `goreleaser release --snapshot --clean` is how this file is verified
  # without tagging anything. The version it stamps says so out loud, so a
  # snapshot binary can never be mistaken for a release when it prints
  # `telltale 0.0.1-SNAPSHOT-<sha>`.
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  # Plain git log, sorted by subject — NOT goreleaser's default
  # Conventional-Commits grouping and NOT `use: github-native`.
  #
  # Two reasons, both specific to this repo. First, CLAUDE.md's commit voice is
  # a lowercase sentence describing the behavior change from the user's side
  # (`council: the gate reads the command, not the punctuation`) and explicitly
  # not a `feat(x):` label, so every commit would land in goreleaser's "Others"
  # bucket and the grouping would be three empty headings. Squash-merge means
  # those subjects are the PR titles, which are already the changelog anyone
  # would write by hand. Second, `github-native` replaces the entire release
  # body with GitHub's generated notes, which would delete the platform-label
  # table below — and that table is the part of the release that has to be
  # true.
  #
  # `sort: asc` sorts the subjects ALPHABETICALLY. It does not order the
  # entries by date, and this comment claimed "ascending" for long enough to
  # mislead a reader who expected a log. The v0.2.0-rc.1 rehearsal
  # (run 31551519867) rendered 80 entries in area-prefix order: arena…, ci:,
  # council:, docs:, and so on.
  #
  # The sort stays. This repo writes every subject as "area: sentence", so an
  # alphabetical sort collects the entries by area, and that is the grouping
  # `use: git` gives up above. A reader who wants the order things landed in
  # reads `git log` or the PR list.
  use: git
  sort: asc
  filters:
    exclude:
      - '^Merge '
      - '^chore\(deps\)'

release:
  github:
    owner: sanlee-ys
    name: telltale
  # Draft, always. Publishing is outward-facing and stays a human action;
  # goreleaser's job ends at "the artifacts and the notes are staged".
  draft: true
  # auto = the tag decides. A tag with a prerelease part (-rc, -beta) stages a
  # prerelease; a plain vX.Y.Z stages a full release.
  #
  # This key was unset, and it defaults to false. The v0.2.0-rc.1 rehearsal
  # (run 31551519867) measured what that costs: the staged release carried
  # `isPrerelease: false` while goreleaser's own scoop step skipped the bucket
  # upload with `reason=release is prerelease`. One file read the tag two
  # different ways. The scoop half was right and the release object was wrong,
  # and the release object is the half a user sees — so a published rc could
  # have arrived labelled as a full release.
  prerelease: auto
  header: |
    **A dispatch room for your coding agents, with an honest gauge underneath.**

    ## What each binary is verified to be

    The honest-gauge rule applies to the platforms as well as the numbers: the
    label says what was measured, not what is expected to work.

    | Download | Verification |
    |---|---|
    | `windows_amd64` | **Windows is the continuously verified target.** Every commit runs vet, the suite, the build and binary-level smokes on `windows-latest` (ADR-002), and this release ran that same gate before these artifacts were built. |
    | `darwin_amd64` | **Smoke-verified on Intel macOS — Windows is the continuously verified target.** Point-in-time: the suite, the build, the statusline smokes, a 53-session live Claude Code read and the HUD all ran on Intel macOS at `052a9d6` (ADR-005, second amendment), and the published `v0.2.0` archive was walked by hand on 2026-08-17 (PARITY.md). CI runs macOS on Apple Silicon only, so nothing runs this Intel binary on every commit, and four of the five adapters have still never met a live macOS corpus. |
    | `darwin_arm64` | **Run in CI on Apple Silicon — Windows is the continuously verified target.** Every commit runs vet, the suite, the build and the binary-level smokes on `macos-latest` (arm64), and this release ran that same gate before these artifacts were built. What that runner cannot measure: it has none of the five vendor CLIs, so no adapter has met a live macOS corpus there and no council turn has been dispatched there. The archive itself has not been unpacked and run by hand on Apple Silicon; CI runs a binary it built from the same commit. |
    | `linux_amd64` | **Built, not verified.** Cross-compiled and never run on Linux by this project. Same label, same reason. |

    Verify a download against `checksums.txt` before running it.
  footer: |
    ## Install

    Windows, via scoop:

    ```
    scoop bucket add telltale https://github.com/sanlee-ys/telltale
    scoop install telltale
    telltale council
    ```

    macOS (and Linux), via the Homebrew tap in this repository:

    ```
    brew tap sanlee-ys/telltale https://github.com/sanlee-ys/telltale
    brew install telltale
    telltale council
    ```

    Or download the archive for your platform above, unpack it, and put
    `telltale` on your PATH:

    ```
    telltale council
    ```

    `telltale council` is the room this project is for. The two gauges wire in
    underneath it — see [README](https://github.com/sanlee-ys/telltale#readme)
    for the statusline block and `telltale hud`.

    `telltale version` prints the tag this binary was built from.

scoops:
  - name: telltale
    ids: [telltale]
    # The bucket lives in THIS repo, under bucket/. Rejected alternative: a
    # second repo, sanlee-ys/scoop-telltale.
    #
    # The deciding cost is a credential, not convenience. goreleaser pushing a
    # manifest into a *different* repo needs a cross-repo PAT held as a release
    # secret; pushing into its own repo needs only the workflow's built-in
    # GITHUB_TOKEN, which the release already has for uploading artifacts. A
    # project whose stated posture is that it reads no credentials should not
    # mint a long-lived write token for a one-file manifest. `scoop bucket add`
    # takes any git repo with a bucket/ directory, so the user-facing command
    # is the same length either way.
    repository:
      owner: sanlee-ys
      name: telltale
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: bucket
    homepage: https://github.com/sanlee-ys/telltale
    description: A dispatch room for several vendor CLIs, with an honest gauge underneath — a statusline and a cross-vendor HUD where every number is traceable to measured tool output.
    license: MIT
    commit_msg_template: "dist: scoop manifest for {{ .ProjectName }} {{ .Tag }}"
    commit_author:
      name: goreleaser
      email: noreply@github.com
    # auto = skip on snapshots and prereleases. A `--snapshot` verification run
    # must never touch main, and a `-rc` tag must never move the bucket users
    # installed from.
    skip_upload: auto

# The Homebrew tap lives in THIS repo too, under Formula/, on the scoop
# bucket's argument: the workflow's own GITHUB_TOKEN can commit here, and a
# second repo (sanlee-ys/homebrew-telltale) would need a cross-repo PAT held
# as a release secret. `brew tap sanlee-ys/telltale <this repo's URL>` takes
# any git repository with a Formula/ directory, so the user-facing command is
# one line either way.
#
# A FORMULA, not a cask, and the choice is the honesty claim (added 2026-09-02).
# Homebrew fetches a formula's URL with curl into its own cache and never
# writes `com.apple.quarantine`, so Gatekeeper is not consulted and the
# unsigned binary runs as installed. A cask is downloaded WITH the quarantine
# attribute, and goreleaser's cask documentation answers that with a
# post-install hook that runs `xattr -dr com.apple.quarantine` on the staged
# binary — a step its own docs label a Gatekeeper bypass that Apple may close
# "without notice". A tap whose install step silently strips the mark is the
# opposite of what SECURITY.md's macOS section says a user should expect.
#
# The cost, measured with goreleaser v2.17.1 (the version release.yml pins):
# `brews` is deprecated there in favour of `homebrew_casks`, and
# `goreleaser check` exits 2 on this file with exactly one line —
# `DEPRECATED: brews should not be used anymore` — while
# `goreleaser release --snapshot --clean` prints the same notice and finishes.
# Deprecated keys are removed only at a major version (goreleaser's
# deprecations page), and the version is pinned, so the formula keeps being
# written until somebody raises the pin on purpose. packaging/README.md
# records how to read `check` now.
#
# Nothing here signs or notarizes. The tap changes nothing about that:
# SECURITY.md's statement stands, and design.md §8 item 8 still holds the
# decision with the owner.
brews:
  - name: telltale
    ids: [telltale]
    repository:
      owner: sanlee-ys
      name: telltale
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/sanlee-ys/telltale
    # Shorter than the scoop description, and shaped for `brew audit`: no
    # leading article, no product name, under 80 characters. The tap is not
    # audited on install; the shape is kept anyway so a homebrew-core
    # submission (design.md §8, once the stars threshold is met) starts from
    # the formula that already ships.
    description: Dispatch room for several coding-agent CLIs, with an honest gauge underneath
    license: MIT
    install: |
      bin.install "telltale"
    # `telltale version` prints the tag the binary was built from, so the
    # formula's own version is the thing to assert. A source build says `dev`
    # and would fail this, which is the point: `brew test` proves the archive
    # the formula names is a release, not a checkout.
    test: |
      assert_match version.to_s, shell_output("#{bin}/telltale version")
    commit_msg_template: "dist: homebrew formula for {{ .ProjectName }} {{ .Tag }}"
    commit_author:
      name: goreleaser
      email: noreply@github.com
    # auto = skip on snapshots and prereleases, for the scoop bucket's reason:
    # a `--snapshot` verification run must never touch main, and an `-rc` tag
    # must never move the formula users installed from.
    skip_upload: auto

# Deliberately NOT configured, each for the same reason the gauges refuse a
# derived number — the package would claim a posture nothing measured:
#
#   - homebrew_casks. See the formula comment above: a cask arrives
#     quarantined, and the only way to make an unsigned cask run is a hook
#     that strips the mark. The formula never sets it. (The old entry here
#     refused a tap altogether because darwin_arm64 was "built, not verified";
#     ci.yml's darwin job runs the binary on Apple Silicon on every commit
#     now, which is the measurement that entry was waiting for.)
#   - homebrew-core. A tap is not a core submission. homebrew-core's own
#     acceptance rules ask for a notable project (75 GitHub stars among the
#     signals it lists), and nothing here measures that number — the README's
#     badge rule says why nothing will render it either.
#   - nfpms (.deb/.rpm). A distro package is a support claim, and Linux is
#     "built, not verified". The tarball carries the label; a package would not.
#   - npm. The bare name `telltale` is taken on the registry by an unrelated
#     option parser, and a Go binary has no reason to be there — design.md §6.5
#     recorded npm as optional-not-required, and it is skipped, not renamed.
#   - winget. Submission is an external PR to microsoft/winget-pkgs and stays a
#     human action. The manifest draft and the flow are in packaging/winget/.
