name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so `release.yml` runs THIS gate rather than a copy of it. A
  # second hand-maintained transcription of vet/test/build/smokes would drift,
  # and the release would then be green against the older one.
  workflow_call:

jobs:
  # The race detector, on the one platform in this gate where it costs nothing
  # extra to have: -race needs cgo, which the Windows job's toolchain setup
  # does not carry and the reference workstation never had — which is exactly
  # how the turn clock's locking (runner/clock.go) stayed "argued, not
  # race-verified" in STATE.md from the day it was written. This job is not a
  # platform claim (windows-latest above remains the verified target, ADR-002);
  # it is the detector finally running at all, on every push, against the same
  # suite. A data race is a property of the Go code, not of the OS that
  # happened to catch it.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test under the race detector
        run: go test -race ./...

  test:
    # Windows is the primary target (ADR-002): the eval runs where the users are.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (fixture eval)
        run: go test ./...
      - name: Build
        run: go build -o telltale.exe ./cmd/telltale
      - name: Smoke (doctor's three states through the real binary)
        shell: pwsh
        run: |
          # This runner has none of the five vendor CLIs, which makes it the
          # exact machine the honest states matter on: every check that CAN pass
          # has nothing to pass against, so anything reading `ok` here is a claim
          # nothing measured (design.md §9.42).
          #
          # The "writes nothing" half is a BEFORE/AFTER of ~/.telltale rather
          # than a Test-Path. `go test ./...` ran two steps ago and the cache
          # packages' own tests use the real home directory, so the directory
          # already exists here — and an assertion that cannot tell doctor's
          # writes from an earlier step's is not an assertion about doctor.
          function Snapshot {
            $dir = "$env:USERPROFILE\.telltale"
            if (-not (Test-Path $dir)) { return '<absent>' }
            (Get-ChildItem $dir -Recurse -File | Sort-Object FullName |
              ForEach-Object { "$($_.FullName)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }) -join "`n"
          }
          $before = Snapshot
          $out = ./telltale.exe doctor --timeout 20s | Out-String
          if ($LASTEXITCODE -ne 0) { throw "doctor exited $LASTEXITCODE; a failed CHECK is this mode working, not a failed command" }
          if ((Snapshot) -ne $before) { throw "doctor changed something under ~/.telltale; the preflight writes nothing at all" }
          if ($out -match 'auth\s+ok' -or $out -match 'network\s+ok') { throw "honesty violation: doctor passed a check it never ran: $out" }
          if ($out -notmatch 'auth\s+not checked') { throw "auth did not report not-checked: $out" }
          if ($out -notmatch 'network\s+not checked') { throw "network did not report not-checked: $out" }
          # The two states a bare machine must actually render. If a vendor CLI
          # is ever preinstalled on this image, THIS is the line that will say so
          # — the assertion is right and its assumption would have changed.
          if ($out -notmatch 'binary\s+FAILED') { throw "a machine with no vendor CLIs reported no failed binary check: $out" }
          if ($out -notmatch 'version\s+not checked') { throw "version was not skipped for a binary that is not there: $out" }
          if ($out -match '\x1b') { throw "doctor emitted ANSI escapes; it is read in pipes and pastes: $out" }

      - name: Smoke (fixture through the real binary)
        shell: pwsh
        run: |
          $out = Get-Content internal/statusline/testdata/apikey.json -Raw | ./telltale.exe statusline
          if ($out -notmatch 'Sonnet') { throw "unexpected statusline output: $out" }
          if ($out -match '5h|7d') { throw "honest-gauge violation: quota rendered without rate_limits: $out" }
          if (Test-Path "$env:USERPROFILE\.telltale\quota") { throw "quota relay wrote for a payload with no rate_limits" }
      - name: Smoke (Antigravity routing through the real binary)
        shell: pwsh
        run: |
          $out = Get-Content internal/statusline/testdata/agy-full.json -Raw | ./telltale.exe statusline
          if ($out -notmatch 'gemini-weekly') { throw "agy payload did not route to the Antigravity renderer: $out" }
          if ($out -match '\$') { throw "honest-gauge violation: cost rendered for a vendor with no cost field: $out" }
          $claude = Get-Content internal/statusline/testdata/full.json -Raw | ./telltale.exe statusline
          if ($claude -notmatch 'Opus') { throw "Claude payload misrouted after the product probe: $claude" }
          # full.json carries the real 2.1.233 context_window token block. Those
          # counts describe ONE API call and total_input_tokens is the window's
          # occupancy, so the statusline must render none of them (design.md
          # §7.16b) — asserted here on the shipped binary, not just the package.
          if ($claude -match '16000|12000|2800|1200') { throw "honest-gauge violation: a per-API-call token count rendered: $claude" }
          # ...and must relay none of them. The token relay accumulates per-turn
          # counts only; there is no per-turn count in this payload to write.
          if (Test-Path "$env:USERPROFILE\.telltale\usage\claude.json") { throw "the Claude statusline wrote a token relay; §7.16b measured no per-turn count it could honestly write" }
      - name: Smoke (Cursor routing through the real binary)
        shell: pwsh
        run: |
          # This vendor stamps NO marker, so the flag is the whole of the routing
          # (design.md §2.2). Driven through the binary because that is where the
          # flag lives.
          $out = Get-Content internal/statusline/testdata/cursor-full.json -Raw | ./telltale.exe statusline --vendor cursor
          if ($out -notmatch 'Composer') { throw "cursor payload did not route to the Cursor renderer: $out" }
          # Match the number alone: the line colors the value, so an ANSI code
          # sits between "ctx " and "34.5%" and a phrase-spanning regex can
          # never match its own passing output.
          if ($out -notmatch '34\.5%') { throw "the one vendor-sourced context reading did not render: $out" }
          # The refusal, asserted on stdout rather than trusted to the struct:
          # remaining_percentage (65.5) and total_input_tokens (68900) are both
          # computed by the CLI from used_percentage and must never be displayed.
          if ($out -match '65\.5|68900|68\.9k') { throw "honest-gauge violation: a CLI-computed value reached the line: $out" }
          if ($out -match '\$') { throw "honest-gauge violation: cost rendered for a vendor with no cost field: $out" }
          # A session before its first API call sends every context_window key as
          # null. That is unread, not zero.
          $nullCtx = Get-Content internal/statusline/testdata/cursor-nocontext.json -Raw | ./telltale.exe statusline --vendor cursor
          if ($nullCtx -match 'ctx') { throw "honest-gauge violation: an unread context rendered: $nullCtx" }
          # Without the flag the same payload has no marker to route on, so it
          # must NOT come out looking like a Cursor line.
          $unflagged = Get-Content internal/statusline/testdata/cursor-full.json -Raw | ./telltale.exe statusline
          if ($unflagged -match 'autorun') { throw "an unflagged cursor payload reached the Cursor renderer: $unflagged" }
          # This payload has no quota, no rate limit and no cost, so the relay
          # must stay silent for it — an empty reading is still a reading.
          if (Test-Path "$env:USERPROFILE\.telltale\quota\cursor.json") { throw "quota relay wrote for a vendor whose payload carries no quota" }
          # Nor a token relay, for the same reason §7.16b asserts it for Claude:
          # this payload's only token-shaped numbers are the two the CLI derives
          # from used_percentage, and they are not on the struct at all (§2.2).
          # The cursor HOOK writes this same file, which is why the assertion
          # lives here — before the hook smoke step further down creates it.
          if (Test-Path "$env:USERPROFILE\.telltale\usage\cursor.json") { throw "the Cursor statusline wrote a token relay; its only token-shaped numbers are CLI-derived" }
      - name: Smoke (quota relay through the real binary)
        shell: pwsh
        run: |
          # The two payloads above carried quota; the relay must now hold one
          # numbers-only entry per vendor (design.md §7.15).
          $cc = Get-Content "$env:USERPROFILE\.telltale\quota\claude.json" -Raw
          if ($cc -notmatch '"seven_day"') { throw "claude quota relay missing its window: $cc" }
          if ($cc -match 'transcript|myproject') { throw "quota relay carried content, not numbers: $cc" }
          $ag = Get-Content "$env:USERPROFILE\.telltale\quota\agy.json" -Raw
          if ($ag -notmatch 'gemini-weekly') { throw "agy quota relay missing its bucket: $ag" }
      # The snapshot document's first consumer that is not its own test
      # (design.md §7.22, amended 2026-08-16). `docs/snapshot.schema.json` is
      # the published contract, and this step is what keeps it honest: it
      # validates the document the BUILT binary prints, not the struct the
      # binary prints from.
      #
      # The validator is pinned Python rather than a Go module. go.mod carries
      # zero direct dependencies outside the TUI stack, and design.md records
      # that stance four times over (the SQLite reader, the zstd reader, the
      # OTLP listener and the event emitter each refused a library); a
      # test-only schema module would still land in the shipped module's
      # graph. Hand-written Go assertions were the third option and are not a
      # schema gate at all — they would be a second statement of the contract,
      # and two statements drift.
      #
      # It runs HERE, after the quota relay smokes, on purpose. Those steps
      # have just written quota/claude.json and quota/agy.json, so this
      # runner's document carries relayed quota rather than the empty arrays a
      # bare machine would emit. A gate whose only fixture is a bare machine
      # checks the empty half of the schema.
      #
      # Measured 2026-08-16 by reproducing this exact sequence with a
      # redirected home: `agy` reaches the document with TWO windows and a
      # quota_read_at, one of them a used_pct of 0 — a measured zero on the
      # runner, unstaged — while `claude` reaches it with `[]` and a null read
      # time. Both fixtures relay; agy's reset times are relative
      # (reset_in_seconds) and survive, and full.json's are absolute unix
      # stamps now in the past, which quotacache drops because a window whose
      # reset has passed describes a window that no longer exists. So this one
      # document happens to carry both halves of the quota shape.
      # The ledger mode (design.md §7.26), driven through the BUILT binary
      # against the synthetic corpus rather than against this runner's own home
      # directory. A bare runner has no Claude transcripts, so an unrooted run
      # would assert only the empty state — which is worth pinning too, and is
      # the second half of this step.
      - name: Smoke (history's honesty grammar through the real binary)
        shell: pwsh
        run: |
          function Tree {
            $dir = "$env:USERPROFILE\.telltale"
            if (-not (Test-Path $dir)) { return '<absent>' }
            (Get-ChildItem $dir -Recurse -File | Sort-Object FullName |
              ForEach-Object { "$($_.FullName)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }) -join "`n"
          }
          $corpus = Join-Path $env:RUNNER_TEMP 'history-corpus'
          go run ./tools/demo-corpus -out $corpus
          if ($LASTEXITCODE -ne 0) { throw "the demo corpus did not write" }

          $before = Tree
          $out = ./telltale.exe history --root $corpus --days 7 --width 120 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "history exited $LASTEXITCODE; this mode prints a report and returns 0" }
          if ((Tree) -ne $before) { throw "history changed something under ~/.telltale; this mode writes nothing at all (§7.26)" }

          # It read the corpus rather than reporting an absent store.
          if ($out -notmatch 'C:\\demo\\') { throw "history read no workspace out of the synthetic corpus: $out" }
          # The exact count the corpus writes. Each of its three Claude sessions
          # carries one assistant record with cache_read_input_tokens 51200, in
          # its own workspace, so the table draws the figure verbatim and
          # ungrouped arithmetic is not involved. If the record shape ever stops
          # being read, this is the line that says so.
          if ($out -notmatch '51,200') { throw "the corpus's cache_read count did not reach the table: $out" }
          # ...and it is EXACT. theme.Tokens' floored form belongs on the gauge
          # surfaces, where a header has no room for digits; this table has the
          # room and rounds nothing.
          if ($out -match '51\.2k|2\.0k') { throw "the table rounded a count: $out" }

          # The honesty grammar, asserted on stdout the way every other smoke in
          # this file is. A token count has no denominator anywhere, so any of
          # these would be a ceiling telltale invented (design.md §7.16, §7.17).
          if ($out -match '%') { throw "honest-gauge violation: a percentage on a spend surface: $out" }
          if ($out -match '\u2588|\u2593|\u21bb') { throw "honest-gauge violation: a gauge or reset glyph on a spend surface: $out" }
          if ($out -match '\$') { throw "honest-gauge violation: a dollar figure telltale holds no price for: $out" }
          if ($out -match '\x1b') { throw "history emitted ANSI escapes; it is read in pipes and pastes: $out" }

          # The window and the vendor travel with every count, and the derived
          # day names the zone it was resolved in.
          if ($out -notmatch 'days resolved in') { throw "the day column does not name its time zone: $out" }
          if ($out -notmatch 'local day') { throw "the report printed counts without their window: $out" }

          # Partial coverage may never read as a fleet answer: every vendor this
          # mode does not read has to be named, in the same frame, with a reason.
          if ($out -notmatch 'covered today: claude') { throw "the report does not say which vendor it speaks for: $out" }
          foreach ($v in 'codex', 'gemini', 'agy', 'cursor', 'grok', 'pi') {
            if ($out -notmatch "\b$v\b") { throw "history never names $v, so its silence about that vendor reads as zero: $out" }
          }

          # A vendor that is surveyed and not read is refused with its verdict,
          # and prints no table at all.
          $refused = ./telltale.exe history --vendor cursor 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw "an uncovered vendor was accepted: $refused" }
          if ($refused -notmatch 'CapNone') { throw "the refusal does not carry the survey's verdict: $refused" }

          Remove-Item -Recurse -Force $corpus

      - name: Install the JSON Schema validator (pinned)
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Gate (the snapshot document against its published schema)
        shell: pwsh
        run: |
          # Each python call is checked on the spot. A native command that
          # exits non-zero does NOT stop a pwsh step — only the LAST exit code
          # reaches the runner — so an unchecked failure here would be hidden
          # by the next call that happens to succeed.
          function Tree {
            $dir = "$env:USERPROFILE\.telltale"
            if (-not (Test-Path $dir)) { return '<absent>' }
            (Get-ChildItem $dir -Recurse -File | Sort-Object FullName |
              ForEach-Object { "$($_.FullName)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }) -join "`n"
          }
          $before = Tree
          ./telltale.exe snapshot --compact > snapshot-live.json
          if ($LASTEXITCODE -ne 0) { throw "snapshot exited $LASTEXITCODE; this mode prints a document and returns 0" }
          if ((Tree) -ne $before) { throw "snapshot changed something under ~/.telltale; this mode writes nothing at all (§7.22)" }
          # One line in, one line out: the compact form is what a program pipes.
          $lines = @(Get-Content snapshot-live.json).Count
          if ($lines -ne 1) { throw "--compact printed $lines lines; a reader that streams gets one" }

          # The ordering claim above, asserted rather than trusted. If agy's
          # window ever stops surviving the relay, this gate quietly loses its
          # only populated `quota` array and goes on passing.
          if ((Get-Content snapshot-live.json -Raw) -notmatch '"quota_read_at":"') {
            throw "no vendor carried a relayed quota window; this gate now checks only the empty half of the schema"
          }

          python tools/validate-snapshot.py snapshot-live.json
          if ($LASTEXITCODE -ne 0) { throw "the built binary's document does not match docs/snapshot.schema.json" }

          # The goldens carry the shapes a bare runner cannot produce: a vendor
          # the operating system refused with its message, a drifted store, a
          # scan error, and the zero-vs-absent pair. Validating them here ties
          # the schema to the fixtures, so a regenerated golden that moved the
          # document's shape reddens this gate too.
          $goldens = @(Get-ChildItem internal/snapshot/testdata/golden/*.json | ForEach-Object { $_.FullName })
          python tools/validate-snapshot.py $goldens
          if ($LASTEXITCODE -ne 0) { throw "a golden document does not match docs/snapshot.schema.json" }

          # A gate that has never failed is a gate nobody has measured. Each
          # mutation breaks the real document one way the contract forbids —
          # a dropped optional key (the omitempty regression), a sentinel
          # string where a nullable number belongs, and a version bump nobody
          # wrote a schema for — and the validator must reject all three.
          foreach ($m in 'drop-key', 'retype-null', 'bump-version') {
            python tools/validate-snapshot.py snapshot-live.json --mutate $m
            if ($LASTEXITCODE -ne 0) { throw "mutation $m survived the schema; this gate is vacuous" }
          }
          Remove-Item snapshot-live.json

      # The same document, in front of the other kind of machine reader
      # (design.md §7.25). This step drives the BUILT binary as an MCP stdio
      # server with a scripted client, and then feeds the tool's own document
      # back through the validator the step above used. That reuse is the
      # point: the MCP surface is a fourth READER of the snapshot document, so
      # the way to check it is the contract the document already publishes, not
      # a second reading of the same rules.
      #
      # It runs after the schema gate so the runner's relayed quota is already
      # written — this document carries the same populated `quota` array that
      # one asserts on, rather than the empty half a bare machine emits.
      - name: Gate (the MCP server through the real binary)
        shell: pwsh
        run: |
          function Tree {
            $dir = "$env:USERPROFILE\.telltale"
            if (-not (Test-Path $dir)) { return '<absent>' }
            (Get-ChildItem $dir -Recurse -File | Sort-Object FullName |
              ForEach-Object { "$($_.FullName)|$($_.Length)|$($_.LastWriteTimeUtc.Ticks)" }) -join "`n"
          }
          $before = Tree

          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = (Resolve-Path ./telltale.exe).Path
          $psi.Arguments = 'mcp'
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $p = [System.Diagnostics.Process]::Start($psi)
          $errTask = $p.StandardError.ReadToEndAsync()

          # One request per line, answers read one line at a time — the stdio
          # transport's own framing. A notification carries no id and MUST NOT
          # be answered, so nothing is read after it; if the server ever
          # answered one, every read below would return the wrong frame and the
          # assertions would fail together.
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"fleet_snapshot","arguments":{}}}'
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"fleet_snapshot","arguments":{"vendor":"chatgpt"}}}'
          )
          $frames = @()
          foreach ($r in $requests) {
            $p.StandardInput.WriteLine($r)
            $p.StandardInput.Flush()
            if ($r -match '"id"') { $frames += $p.StandardOutput.ReadLine() }
          }
          $p.StandardInput.Close()
          if (-not $p.WaitForExit(60000)) {
            $p.Kill($true)
            throw "the MCP server did not exit after its client closed stdin; EOF is the clean end of an stdio session"
          }
          $err = $errTask.GetAwaiter().GetResult()
          if ($p.ExitCode -ne 0) { throw "telltale mcp exited $($p.ExitCode): $err" }
          if ($err) { throw "the MCP server wrote to stderr: $err" }
          if ((Tree) -ne $before) { throw "an MCP session changed something under ~/.telltale; this mode writes nothing at all (§7.25)" }
          # A closed stream reads as $null, and every assertion below would then
          # fail on a missing property rather than on the thing that broke.
          if ($frames.Count -ne 4 -or ($frames | Where-Object { -not $_ })) {
            throw "the server stopped answering: got $($frames.Count) frames, one of them empty. $err"
          }

          $init = $frames[0] | ConvertFrom-Json
          if ($init.result.protocolVersion -ne '2025-06-18') {
            throw "the handshake answered $($init.result.protocolVersion) to a client asking for a supported revision"
          }
          if (-not $init.result.serverInfo.name) { throw "the handshake named no server: $($frames[0])" }

          $list = $frames[1] | ConvertFrom-Json
          if ($list.result.tools[0].name -ne 'fleet_snapshot') { throw "tools/list did not name the tool: $($frames[1])" }
          # The calling MODEL reads this description and nothing else before it
          # decides what a value means, so the honesty rules have to be in it.
          foreach ($word in 'null', 'estimated', 'unsupported', 'self_reported') {
            if ($list.result.tools[0].description -notmatch $word) {
              throw "the tool description never mentions $word; a caller that does not know the rules reads a null as a zero"
            }
          }

          $call = $frames[2] | ConvertFrom-Json
          if ($call.result.isError) { throw "the tool call failed: $($frames[2])" }
          # The text content and structuredContent are one document marshalled
          # twice. Validating the TEXT is the stronger of the two, because that
          # is the byte string a client shows a model.
          $call.result.content[0].text | Set-Content -Path mcp-doc.json -Encoding utf8
          python tools/validate-snapshot.py mcp-doc.json
          if ($LASTEXITCODE -ne 0) { throw "the document served over MCP does not match docs/snapshot.schema.json" }
          # A gate that only reads the text half would miss a structuredContent
          # that had drifted, and a client may read either one.
          $call.result.structuredContent | ConvertTo-Json -Depth 12 | Set-Content -Path mcp-structured.json -Encoding utf8
          python tools/validate-snapshot.py mcp-structured.json
          if ($LASTEXITCODE -ne 0) { throw "structuredContent does not match docs/snapshot.schema.json; the two spellings have drifted" }
          Remove-Item mcp-doc.json, mcp-structured.json

          # A bad argument is a RESULT the model can read, never a transport
          # error it cannot — and it carries no document, because there is no
          # measurement behind it.
          $bad = $frames[3] | ConvertFrom-Json
          if ($bad.error) { throw "a bad vendor came back as a JSON-RPC error: $($frames[3])" }
          if (-not $bad.result.isError) { throw "a bad vendor was reported as a successful call: $($frames[3])" }
          if ($bad.result.structuredContent) { throw "a failed call carried a document: $($frames[3])" }
          if ($bad.result.content[0].text -notmatch 'chatgpt') { throw "the refusal does not name what was wrong: $($frames[3])" }

      - name: Smoke (cursor token relay through the real binary)
        shell: pwsh
        run: |
          # A REAL afterAgentResponse payload shape, carrying the two things that
          # must never survive it: the model's reply text and the user's email
          # address (design.md §7.16). Driven through the BINARY rather than the
          # package, because the boundary claim is about what ships.
          $payload = '{"conversation_id":"c-1","generation_id":"g-1","model":"composer-2.5","text":"SECRET-REPLY","input_tokens":48012,"output_tokens":1203,"cache_read_tokens":1904221,"cache_write_tokens":62004,"transcript_path":"C:\\SECRET-PATH\\x.jsonl","user_email":"SECRET@example.com"}'
          $out = $payload | ./telltale.exe hook cursor
          # A hook's stdout is parsed by the vendor as a hook result, so this
          # path prints nothing at all.
          if ($out) { throw "the hook wrote to stdout: $out" }
          $cx = Get-Content "$env:USERPROFILE\.telltale\usage\cursor.json" -Raw
          if ($cx -notmatch '"input_tokens":48012') { throw "token relay missing its counts: $cx" }
          if ($cx -notmatch '"turns":1') { throw "token relay missing its window: $cx" }
          if ($cx -match 'SECRET|composer|conversation|generation') { throw "token relay carried content, not numbers: $cx" }
          # Twice is a total, not a replacement, and the window says so.
          $payload | ./telltale.exe hook cursor
          $cx = Get-Content "$env:USERPROFILE\.telltale\usage\cursor.json" -Raw
          if ($cx -notmatch '"input_tokens":96024' -or $cx -notmatch '"turns":2') {
            throw "the second turn did not accumulate: $cx"
          }
          # A payload with no counts is a non-event, never a zeroed total.
          '{"conversation_id":"c-2","text":"no usage here"}' | ./telltale.exe hook cursor
          $cx = Get-Content "$env:USERPROFILE\.telltale\usage\cursor.json" -Raw
          if ($cx -notmatch '"turns":2') { throw "an empty payload disturbed the total: $cx" }

      - name: Smoke (a taken OTLP port through the real binary)
        shell: pwsh
        run: |
          # The 4318 collision message (design.md §7.16a) has unit tests. This
          # asserts it on the SHIPPED binary, because the operator does not meet
          # it as a returned error: he meets it as a process that exited, and the
          # exit code and the stream it lands on are only true at this level
          # (main.go prints it to STDERR and exits 1).
          #
          # A throwaway .NET listener holds the port rather than a second
          # telltale. The collision this message is about is with ANOTHER OTLP
          # receiver, and a bare listener is the cheapest honest stand-in for one
          # — the same setup the message was measured against on 2026-08-16.
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 4318)
          $listener.Start()
          try {
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = (Resolve-Path ./telltale.exe).Path
            $psi.Arguments = 'otel grok'
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.UseShellExecute = $false
            $p = [System.Diagnostics.Process]::Start($psi)
            # Drain both streams asynchronously BEFORE the wait, and bound the
            # wait. A synchronous ReadToEnd blocks until the process exits, which
            # is the one thing this step must not assume: if the bind wrongly
            # SUCCEEDED, `otel grok` is a foreground server and serves forever.
            # The timeout is what turns that into a failure here instead of a job
            # that hangs to the runner's own limit.
            $outTask = $p.StandardOutput.ReadToEndAsync()
            $errTask = $p.StandardError.ReadToEndAsync()
            if (-not $p.WaitForExit(30000)) {
              $p.Kill($true)
              throw "otel grok did not exit against a held 127.0.0.1:4318; it bound a port another process already holds, or it hung"
            }
            $out = $outTask.GetAwaiter().GetResult()
            $err = $errTask.GetAwaiter().GetResult()
            $code = $p.ExitCode
          } finally {
            $listener.Stop()
          }
          if ($code -ne 1) { throw "otel grok exited $code on a taken port; a collector that cannot bind must fail loudly: $err" }
          # The way out, matched as bare values. This message wraps at a fixed
          # column and the flag sits at the end of its own line, so a
          # phrase-spanning regex could never match its own passing output — the
          # same trap the Cursor smoke calls out above.
          if ($err -notmatch '--addr') { throw "the collision message never names the flag that moves the collector: $err" }
          if ($err -notmatch '127\.0\.0\.1:4319') { throw "the collision message suggests no free port to move to: $err" }
          # Moving this side alone counts nothing, so the grok-side half of the
          # way out has to survive too.
          if ($err -notmatch 'OTEL_EXPORTER_OTLP_ENDPOINT') { throw "the collision message dropped the exporter half of the way out: $err" }
          if ($err -notmatch 'bind error:') { throw "the collision message dropped the verbatim bind error: $err" }
          # The honesty half: a collector that never bound must not have said it
          # was listening. That line goes to STDOUT (grokotel.Run's logf), which
          # is why the two streams are read apart rather than merged.
          if ($out -match 'listening on') { throw "a collector that failed to bind claimed it was listening: $out" }
          if ($err -match '\x1b') { throw "the collision message emitted ANSI escapes; it is read in pipes and pastes: $err" }

      - name: Smoke (a taken event-sink port through the real binary)
        shell: pwsh
        run: |
          # The twin of the 4318 step above, for the event sink (design.md
          # §7.21, message added in PR #267). It is asserted here for the same
          # reason: the operator does not meet this as a returned error, he
          # meets it as a process that exited, and the exit code and the stream
          # it lands on are only true at this level.
          #
          # The child runs with USERPROFILE pointed at a throwaway directory.
          # `telltale events` OPENS its store before it binds, so a refused
          # bind still creates ~/.telltale/events — and this job has steps that
          # compare that tree before and after a command.
          $sinkHome = Join-Path $env:RUNNER_TEMP 'eventsink-home'
          New-Item -ItemType Directory -Force -Path $sinkHome | Out-Null
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 4519)
          $listener.Start()
          try {
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = (Resolve-Path ./telltale.exe).Path
            $psi.Arguments = 'events'
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.Environment['USERPROFILE'] = $sinkHome
            $p = [System.Diagnostics.Process]::Start($psi)
            # Drain both streams before the wait, and bound the wait, for the
            # reason the OTLP step does: if the bind wrongly SUCCEEDED, this
            # mode is a foreground server and serves forever.
            $outTask = $p.StandardOutput.ReadToEndAsync()
            $errTask = $p.StandardError.ReadToEndAsync()
            if (-not $p.WaitForExit(30000)) {
              $p.Kill($true)
              throw "telltale events did not exit against a held 127.0.0.1:4519; it bound a port another process already holds, or it hung"
            }
            $out = $outTask.GetAwaiter().GetResult()
            $err = $errTask.GetAwaiter().GetResult()
            $code = $p.ExitCode
          } finally {
            $listener.Stop()
          }
          if ($code -ne 1) { throw "telltale events exited $code on a taken port; a sink that cannot bind must fail loudly: $err" }
          # The way out, matched as bare values. This message wraps at a fixed
          # column and both flags sit at the end of their own lines, so a
          # phrase-spanning regex could never match its own passing output —
          # the same trap the Cursor and OTLP steps call out.
          if ($err -notmatch '--addr') { throw "the collision message never names the flag that moves the sink: $err" }
          # Moving this side alone stores nothing, so the emitter half of the
          # way out has to survive too. It is the sharper half here: an unmoved
          # emitter exits 0 by design, so a half-moved sink looks exactly like
          # a fleet where no hook ever fired.
          if ($err -notmatch '--server-url') { throw "the collision message dropped the emitter half of the way out: $err" }
          if ($err -notmatch '127\.0\.0\.1:4520') { throw "the collision message suggests no free port to move to: $err" }
          if ($err -notmatch 'bind error:') { throw "the collision message dropped the verbatim bind error: $err" }
          # A sink that never bound must not have said it was listening. That
          # line goes to STDOUT, which is why the two streams are read apart.
          if ($out -match 'listening on') { throw "a sink that failed to bind claimed it was listening: $out" }
          if ($err -match '\x1b') { throw "the collision message emitted ANSI escapes; it is read in pipes and pastes: $err" }

      # packaging/install.ps1 is the `irm | iex` route (design.md §8, added
      # 2026-08-18). It is the one shipped file no Go test can reach, and it
      # runs on a stranger's machine before anything else telltale does.
      #
      # This step PARSES it and never executes it: running it would download a
      # release on every push. It runs under Windows PowerShell 5.1 rather than
      # pwsh, because 5.1 is the shell the trap lives in — it reads a BOM-less
      # file as ANSI, so a single em dash anywhere in this file breaks the parse
      # before the script runs. That was measured on 2026-08-18 and it cost four
      # parser errors under 5.1.26100.9168 while pwsh 7.6.5 read the same file
      # fine, which is exactly the shape of defect a gate has to hold.
      - name: Gate (install.ps1 parses under Windows PowerShell 5.1, and is ASCII only)
        shell: powershell
        run: |
          $path = (Resolve-Path packaging/install.ps1).Path
          $bytes = [IO.File]::ReadAllBytes($path)
          $high = @($bytes | Where-Object { $_ -ge 0x80 }).Count
          if ($high -ne 0) {
            throw "install.ps1 carries $high byte(s) at or above 0x80. Windows PowerShell 5.1 reads this BOM-less file as ANSI and the parse breaks. Keep it ASCII."
          }
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            throw "install.ps1 does not parse: $($errors | ForEach-Object { $_.Message })"
          }
          # `exit` inside a piped script ends the user's own shell session, so
          # the script throws instead. A future edit that reaches for `exit` is
          # the regression this line catches.
          if (Select-String -Path $path -Pattern '^\s*exit\b' -Quiet) {
            throw "install.ps1 calls exit; a script run through irm | iex ends the user's shell that way. Throw instead."
          }

      # ADR-002's fast path, on the clock rather than on anecdote (design.md §5,
      # amendment 2026-08-16). This runs LAST on purpose: it drives full.json,
      # which carries rate_limits and therefore writes the quota relay, and two
      # earlier steps assert on that relay's absence and then on its contents.
      #
      # This step REPORTS and holds a ceiling; it does not pin the budget. The
      # hard gate for ADR-002 is TestFastPathNeverReachesTUIFramework in
      # internal/statusline, which is deterministic. A shared runner cannot pin
      # single-digit milliseconds — its own scheduling noise is larger than the
      # thing being measured — so the number goes in the log for a human, and
      # only a gross regression fails the build.
      - name: Statusline fast-path latency (reported; gross-regression ceiling)
        shell: pwsh
        run: |
          # The ceiling catches a regression that changes the SHAPE of this
          # path: a whole-corpus scan (design.md §7.18 measured cold scans at
          # 896-1200 ms), a network round trip, or a TUI initialization with
          # its terminal-capability queries. It deliberately does NOT catch a
          # small constant regression — nothing on a shared runner can.
          $ceilingMs = 400
          $payload = Get-Content internal/statusline/testdata/full.json -Raw
          $exe = (Resolve-Path ./telltale.exe).Path
          $samples = @()
          foreach ($i in 1..15) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $exe
            $psi.Arguments = 'statusline'
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $psi.UseShellExecute = $false
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $p = [System.Diagnostics.Process]::Start($psi)
            $p.StandardInput.Write($payload)
            $p.StandardInput.Close()
            $out = $p.StandardOutput.ReadToEnd()
            $p.WaitForExit()
            $sw.Stop()
            # A crash is fast. Assert the line rendered on EVERY sample, or the
            # timing below would report a broken binary as an improvement.
            if ($p.ExitCode -ne 0) { throw "statusline exited $($p.ExitCode) on sample ${i}" }
            if ($out -notmatch 'Opus') { throw "sample ${i} rendered no line: $out" }
            $samples += $sw.Elapsed.TotalMilliseconds
          }
          $sorted = $samples | Sort-Object
          # Floor, not [int]: PowerShell's [int] cast rounds to even, so an odd
          # sample count would pick the element above the median.
          $median = $sorted[[int][math]::Floor($sorted.Count / 2)]
          "statusline end-to-end (process start + parse + render), n=$($sorted.Count):"
          "  min    {0:N1} ms" -f $sorted[0]
          "  median {0:N1} ms" -f $median
          "  max    {0:N1} ms" -f $sorted[-1]
          # Measured by this same harness on the reference workstation
          # (i7-7700K, Windows 11) over two runs, 2026-08-16.
          "  (reference workstation 2026-08-16: median 26.6 and 29.0 ms over two runs; min 21.7, max 50.6)"
          if ($median -gt $ceilingMs) {
            throw "statusline median $([int]$median) ms exceeds the ${ceilingMs} ms ceiling; this path grew a scan, a network call or a TUI init"
          }
